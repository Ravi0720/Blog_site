<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Signup</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav>
    <a href="index.html">Home</a>
    <a href="blog.html">Blog</a>
    <a href="login.html">Login</a>
    <a href="signup.html">Signup</a>
    <a href="post.html">Create Post</a>
    <a href="admin.html">Admin</a>
  </nav>
  <div class="container">
    <h1>Signup</h1>
    <form id="signup-form">
      <input type="text" id="username" placeholder="Username" required>
      <input type="email" id="email" placeholder="Email" required>
      <input type="password" id="password" placeholder="Password" required>
      <button type="submit">Signup</button>
    </form>
    <p>Already have an account? <a href="login.html">Login</a></p>
    <h3>Or signup with:</h3>
    <a href="http://localhost:3000/api/auth/github"><button>Signup with GitHub</button></a>
    <a href="http://localhost:3000/api/auth/google"><button>Signup with Google</button></a>
    <script>
      document.getElementById('signup-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const username = document.getElementById('username').value;
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        const response = await fetch('http://localhost:3000/api/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, email, password }),
        });
        const result = await response.json();
        if (response.ok) {
          alert('Registration successful! Please log in.');
          window.location.href = 'login.html';
        } else {
          alert(result.message);
        }
      });
    </script>
  </div>
</body>
</html>
